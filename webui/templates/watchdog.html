<!-- Internet Watchdog: independent of LTE hardware availability. -->
<div class="card mt-3">
  <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
    <h5 class="mb-0">Internet Watchdog</h5>
    <div class="d-flex flex-wrap gap-2">
      <button type="button" class="btn btn-success btn-sm manage-only" onclick="addWatchdogTarget()">Add Target</button>
      <button type="button" class="btn btn-primary btn-sm manage-only" onclick="saveWatchdogTargets()">Save</button>
    </div>
  </div>
  <div class="card-body">
    <p class="text-muted small">Targets the watchdog checks for internet connectivity. Supports IPs (ping), hostnames (ping), and URLs (curl). If all fail, the device reboots.</p>
    <div id="watchdogTargets">
      <!-- Rows populated by JS -->
    </div>
  </div>
</div>
