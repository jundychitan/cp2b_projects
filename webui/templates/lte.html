<!-- LTE Setting Tab -->
<div class="card mt-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">LTE Setting</h5>
    <button class="btn btn-danger btn-sm admin-only" onclick="rebootLte()">LTE Reboot</button>
  </div>
  <div class="card-body">
    <div class="mb-2 row">
      <label class="col-sm-3 col-form-label">SIM Status</label>
      <div class="col-sm-6">
        <input type="text" class="form-control-plaintext fw-bold" id="lteSimStatus" readonly value="--">
      </div>
    </div>
    <div class="mb-2 row">
      <label class="col-sm-3 col-form-label">IP Address</label>
      <div class="col-sm-6">
        <input type="text" class="form-control-plaintext" id="lteIpAddress" readonly value="--">
      </div>
    </div>
    <div class="mb-2 row">
      <label class="col-sm-3 col-form-label">Status</label>
      <div class="col-sm-6">
        <input type="text" class="form-control-plaintext" id="lteStatus" readonly value="--">
      </div>
    </div>
    <div class="mb-2 row">
      <label class="col-sm-3 col-form-label">Carrier</label>
      <div class="col-sm-6">
        <input type="text" class="form-control-plaintext" id="lteCarrier" readonly value="--">
      </div>
    </div>
    <div class="mb-2 row">
      <label class="col-sm-3 col-form-label">Access</label>
      <div class="col-sm-6">
        <input type="text" class="form-control-plaintext" id="lteAccess" readonly value="--">
      </div>
    </div>
    <div class="mb-2 row">
      <label class="col-sm-3 col-form-label">Band</label>
      <div class="col-sm-6">
        <input type="text" class="form-control-plaintext" id="lteBand" readonly value="--">
      </div>
    </div>
    <div class="mb-2 row">
      <label class="col-sm-3 col-form-label">Signal</label>
      <div class="col-sm-6">
        <input type="text" class="form-control-plaintext" id="lteSignal" readonly value="--">
      </div>
    </div>
  </div>
</div>

<!-- Internet Watchdog -->
<div class="card mt-3">
  <div class="card-header"><h5>Internet Watchdog</h5></div>
  <div class="card-body">
    <p class="text-muted small">Targets the watchdog checks for internet connectivity. Supports IPs (ping), hostnames (ping), and URLs (curl). If all fail, the device reboots.</p>
    <div id="watchdogTargets">
      <!-- Rows populated by JS -->
    </div>
    <div class="mt-2">
      <button class="btn btn-success btn-sm admin-only" onclick="addWatchdogTarget()">Add Target</button>
    </div>
    <div class="mt-3 text-end">
      <button class="btn btn-primary admin-only" onclick="saveWatchdogTargets()">Save</button>
    </div>
  </div>
</div>
