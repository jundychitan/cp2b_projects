<!-- RTU Setting Tab -->
<section id="rtuNetworkNotice"
         class="position-fixed top-0 start-0 w-100 h-100 bg-body d-none"
         style="z-index: 2000;" role="status" aria-live="polite">
  <div class="container py-5">
    <div class="card mx-auto" style="max-width: 650px;">
      <div class="card-body p-4">
        <h4 id="rtuNetworkMessage"></h4>
        <p id="rtuNetworkDetail" class="mb-4"></p>
        <button type="button" id="rtuNetworkReturn" class="btn btn-outline-secondary"
                onclick="dismissRtuNetworkNotice()">Return to settings</button>
      </div>
    </div>
  </div>
</section>
<div class="card mt-3">
  <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
    <h5 class="mb-0">MAC Address</h5>
  </div>
  <div class="card-body">
    <!-- MAC Address (read-only) -->
    <div class="mb-3 row">
      <label class="col-sm-3 col-form-label">MAC Address</label>
      <div class="col-sm-6">
        <input type="text" class="form-control-plaintext" id="rtuMac" readonly value="--">
      </div>
    </div>

  </div>
</div>

<div class="card mt-3">
  <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
    <h5 class="mb-0">Network Setting</h5>
    <button type="button" class="btn btn-primary btn-sm manage-only" onclick="saveRtuNetwork()">Save Network</button>
  </div>
  <div class="card-body">
    <!-- IP Method Toggle -->
    <div class="mb-3 row">
      <label class="col-sm-3 col-form-label">IP Method</label>
      <div class="col-sm-6">
        <div class="form-check form-check-inline mt-2">
          <input class="form-check-input manage-only" type="radio" name="rtuMethod" id="rtuDhcp"
                 value="auto" checked onchange="toggleRtuMethod()">
          <label class="form-check-label" for="rtuDhcp">DHCP</label>
        </div>
        <div class="form-check form-check-inline mt-2">
          <input class="form-check-input manage-only" type="radio" name="rtuMethod" id="rtuStatic"
                 value="manual" onchange="toggleRtuMethod()">
          <label class="form-check-label" for="rtuStatic">Static</label>
        </div>
      </div>
    </div>

    <!-- IP Address -->
    <div class="mb-3 row">
      <label for="rtuIp" class="col-sm-3 col-form-label">IP Address</label>
      <div class="col-sm-6">
        <input type="text" class="form-control rtu-static-field" id="rtuIp"
               placeholder="e.g. 192.168.1.100" disabled>
      </div>
    </div>

    <!-- Subnet -->
    <div class="mb-3 row">
      <label for="rtuSubnet" class="col-sm-3 col-form-label">Subnet</label>
      <div class="col-sm-6">
        <input type="text" class="form-control rtu-static-field" id="rtuSubnet"
               value="24" placeholder="e.g. 24" disabled>
      </div>
    </div>

    <!-- Gateway -->
    <div class="mb-3 row">
      <label for="rtuGateway" class="col-sm-3 col-form-label">Gateway</label>
      <div class="col-sm-6">
        <input type="text" class="form-control rtu-static-field" id="rtuGateway"
               placeholder="e.g. 192.168.1.1" disabled>
      </div>
    </div>

    <!-- DNS Servers -->
    <div class="mb-3 row">
      <label for="rtuDns" class="col-sm-3 col-form-label">DNS Server(s)</label>
      <div class="col-sm-6">
        <input type="text" class="form-control rtu-static-field" id="rtuDns"
               placeholder="e.g. 8.8.8.8, 8.8.4.4" disabled>
        <small class="form-text text-muted">Comma-separated. Leave blank for DHCP-provided DNS.</small>
      </div>
    </div>

  </div>
</div>

<div class="card mt-3">
  <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
    <h5 class="mb-0">AMR Server Setting</h5>
    <div class="d-flex flex-wrap gap-2">
      <button type="button" class="btn btn-primary btn-sm manage-only" onclick="saveRtuServer()">Save Server IP</button>
      <button type="button" class="btn btn-primary btn-sm manage-only" onclick="saveRtuLocation()">Save Location</button>
    </div>
  </div>
  <div class="card-body">
    <!-- Remote Server IP -->
    <div class="mb-3 row">
      <label for="rtuServerIp" class="col-sm-3 col-form-label">Remote Server IP</label>
      <div class="col-sm-6">
        <input type="text" class="form-control" id="rtuServerIp" placeholder="e.g. 10.0.0.1">
      </div>
    </div>

    <!-- Location -->
    <div class="mb-3 row">
      <label for="rtuLocation" class="col-sm-3 col-form-label">Location</label>
      <div class="col-sm-6">
        <input type="text" class="form-control" id="rtuLocation" placeholder="e.g. Building A">
      </div>
    </div>
  </div>
</div>
