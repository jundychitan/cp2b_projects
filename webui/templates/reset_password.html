<div class="modal fade" id="resetUserPasswordModal" tabindex="-1"
     aria-labelledby="resetUserPasswordTitle" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="resetUserPasswordTitle">Reset User Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="resetUserPasswordAlert" class="alert d-none" role="status" aria-live="polite"></div>
        <label for="resetUserPasswordTarget" class="form-label">User</label>
        <select id="resetUserPasswordTarget" class="form-select mb-3">
          <option value="dec">dec</option>
          <option value="amr">amr</option>
        </select>
        <p>The selected user's password will be reset to <strong>1234</strong>.
          Ask them to change it after signing in. Existing signed-in sessions are not logged out.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" id="resetUserPasswordBtn"
                data-csrf-token="{{ password_reset_csrf_token() }}"
                onclick="resetUserPassword()">Reset to 1234</button>
      </div>
    </div>
  </div>
</div>
